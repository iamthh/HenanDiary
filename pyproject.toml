[project]
name = "henandiary"
version = "0.1.0"
description = "桌面日报生成应用：定时截图 → AI 分析 → 每晚自动生成日报"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0.1",
    "pillow>=10.4.0",
    "openai>=1.51.0",
    "pywin32>=306",
    "apscheduler>=3.10.4",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

# 纯应用，不需要构建成可安装包，直接从源码运行
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
